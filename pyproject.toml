]
maintainers = [
    { name = "Adrim Hamed Outmani", email = "adrimh.outmani@gmail.com" }
]

keywords = [
  "pharmacogenetics",
  "pharmacogenomics",
  "precision-medicine",
  "drug-response-prediction",
  "clinical-decision-support",
  "pharmacy",
  "adverse-drug-events",
  "therapeutic-efficacy",
  #############################
  "deep-learning",
  "pytorch",
  "deepfm",
  "neural-networks",
  "artificial-intelligence",
  "machine-learning",
  "optuna",
  "hyperparameter-optimization",
  #############################
