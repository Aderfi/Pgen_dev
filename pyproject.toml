# =============================================================================
# UV CONFIGURATION
# =============================================================================


# =============================================================================
# CONFIGURACIÓN DE SETUPTOOLS (Layout src)
# =============================================================================
[tool.setuptools]
# Soporte para archivos de datos
include-package-data = true
[tool.setuptools.packages.find]
where = ["src"]  # Source code lives under src/
include = ["*"]

# =============================================================================
# CONFIGURACIÓN DE HERRAMIENTAS DE CALIDAD DE CÓDIGO
# =============================================================================
[tool.ruff]
# Directorios a excluir
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".venv_pgen",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "BACKUPS",
    "cache",
]

# Configuración básica
line-length = 88
indent-width = 4
target-version = "py310"

[tool.ruff.lint]
# Reglas habilitadas
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "PL",    # pylint
    "RUF",   # ruff-specific rules
]

ignore = [
    "E203",    # Espacio antes de ':', incompatible con formatters
    "E501",    # Longitud de línea, gestionado por el formatter
    "F403",    # 'from module import *' - permitido en algunos casos
    "F401",    # Importación no utilizada - puede ser intencional
    "PLR0913", # Demasiados argumentos en función
    "PLR2004", # Magic value usado en comparación
    "PLC0415", # Importación fuera del top-level
    "FIX003", # TODOs
    "EM101",  # Raw string literals in exceptions
    "D212",   # Multi-line docstring summary start
]


# Permitir arreglos automáticos
fixable = ["ALL"]
unfixable = []

# Variables dummy permitidas
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/**/*.py" = ["PLR2004", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["pharmagen"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.format]
# Estilo de formateo (compatible con Black)
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

# =============================================================================
# CONFIGURACIÓN DE PYTEST
# =============================================================================
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=pharmagen",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

# =============================================================================
# CONFIGURACIÓN DE MYPY (Type Checking)
# =============================================================================
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "biopython.*",
    "torch.*",
    "sklearn.*",
    "optuna.*",
]
ignore_missing_imports = true

# =============================================================================
# CONFIGURACIÓN DE COVERAGE
# =============================================================================
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
