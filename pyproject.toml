#[build-system]
#requires = ["setuptools>=61.0", "wheel"]
#build-backend = "setuptools.build_meta"

[project]
name = "dev_Pharmagen"
version = "1.5.0"
description = "Pharmacogenetic prediction and therapeutic efficacy software powered by Deep Learning"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { file = "LICENSE" }
authors = [
    { name = "Adrim Hamed Outmani", email = "adrimh.outmani@gmail.com" }
]
maintainers = [
    { name = "Adrim Hamed Outmani", email = "adrimh.outmani@gmail.com" }
]

keywords = [
  "pharmacogenetics",
  "pharmacogenomics",
  "precision-medicine",
  "drug-response-prediction",
  "clinical-decision-support",
  "pharmacy",
  "adverse-drug-events",
  "therapeutic-efficacy",
  #############################
  "deep-learning",
  "pytorch",
  "graph-neural-networks",
  "neural-networks",
  "artificial-intelligence",
  "machine-learning",
  "optuna",
  "hyperparameter-optimization",
  #############################
  "bioinformatics",
  "genomics",
  "vcf-processing",
  "variant-analysis",
  "gene-networks",
]


classifiers = [
  # Estado del proyecto
  "Development Status :: 4 - Beta",

  "Intended Audience :: Healthcare Industry",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",

  # Licencia 
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",

  # Lenguaje
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",

  # Temáticas Científicas
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",

  # Entorno de Ejecución
  "Environment :: Console",  
  "Environment :: GPU :: NVIDIA CUDA",
  "Operating System :: OS Independent", # Preference Linux but also works on Windows. OSX not tested.
]
dependencies = [
    # Core data / config
    "pydantic>=2.12.5",
    "pydantic-settings>=2.0.0",
    "polars>=1.39.3",
    "pandas>=2.3.0",
    "numpy>=2.0.0",
    "networkx<=3.5",
    "scikit-learn",
    "joblib>=1.5.0",
    "tqdm",
    # Deep learning — CUDA 13.0 wheels routed via [tool.uv.sources]
    "torch==2.11.0",
    "torchvision==0.26.0",
    "torchaudio==2.11.0",
    "torch_geometric>=2.6.0",
    "pyg_lib",
    "torch_scatter",
    "torch_sparse",
    "optuna>=4.0.0",
    # Genomics / cheminformatics
    "rdkit>=2025.9.6",
    "pysam>=0.22.0",
    "pyfaidx>=0.9.0.4",
    "biopython>=1.85",
    # API service
    "fastapi>=0.135.2",
    "uvicorn>=0.30.0",
    # Misc
    "requests>=2.32.0",
    "matplotlib>=3.10.0",
    "admet-ai>=2.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.28.0",     # API TestClient transport
    "ruff>=0.0.280",
    "mypy>=1.3.0",
    "coverage>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/Aderfi/Pharmagen_development"
Repository = "https://github.com/Aderfi/Pharmagen_development"
Documentation = "https://github.com/Aderfi/Pharmagen_development/blob/main/README.md"
"Bug Tracker" = "https://github.com/Aderfi/Pharmagen_development/issues"

# =============================================================================
# UV CONFIGURATION
# =============================================================================
# PyTorch CUDA 13.0 wheels live on the PyTorch index; the PyG companion
# wheels (pyg_lib/torch_scatter/torch_sparse) live on a flat find-links
# index keyed by the exact torch+CUDA build. Both indexes are `explicit`,
# so they are only consulted for the packages mapped in [tool.uv.sources].
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pyg"
url = "https://data.pyg.org/whl/torch-2.11.0+cu130.html"
format = "flat"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
pyg_lib = { index = "pyg" }
torch_scatter = { index = "pyg" }
torch_sparse = { index = "pyg" }


# =============================================================================
# CONFIGURACIÓN DE SETUPTOOLS (Layout src)
# =============================================================================
[tool.setuptools]
# Soporte para archivos de datos
include-package-data = true
[tool.setuptools.packages.find]
where = ["src"]  # Source code lives under src/
include = ["*"]

# =============================================================================
# CONFIGURACIÓN DE PYTEST
# =============================================================================
# Ruff is configured in ruff.toml (single source of truth), not here.
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

# =============================================================================
# CONFIGURACIÓN DE MYPY (Type Checking)
# =============================================================================
[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "biopython.*",
    "torch.*",
    "sklearn.*",
    "optuna.*",
]
ignore_missing_imports = true

# =============================================================================
# CONFIGURACIÓN DE COVERAGE
# =============================================================================
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
