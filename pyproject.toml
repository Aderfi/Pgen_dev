#[build-system]
#requires = ["setuptools>=61.0", "wheel"]
#build-backend = "setuptools.build_meta"

[project]
name = "dev_Pharmagen"
version = "1.5.0"
description = "Pharmacogenetic prediction and therapeutic efficacy software powered by Deep Learning"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = { file = "LICENSE" }
authors = [
    { name = "Adrim Hamed Outmani", email = "adrimh.outmani@gmail.com" }
]
maintainers = [
    { name = "Adrim Hamed Outmani", email = "adrimh.outmani@gmail.com" }
]

keywords = [
  "pharmacogenetics",
  "pharmacogenomics",
  "precision-medicine",
  "drug-response-prediction",
  "clinical-decision-support",
  "pharmacy",
  "adverse-drug-events",
  "therapeutic-efficacy",
  #############################
  "deep-learning",
  "pytorch",
  "graph-neural-networks",
  "neural-networks",
  "artificial-intelligence",
  "machine-learning",
  "optuna",
  "hyperparameter-optimization",
  #############################
  "bioinformatics",
  "genomics",
  "vcf-processing",
  "variant-analysis",
  "gene-networks",
]


classifiers = [
  # Estado del proyecto
  "Development Status :: 4 - Beta",

  "Intended Audience :: Healthcare Industry",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",

  # Licencia 
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",

  # Lenguaje
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3 :: Only",

  # Temáticas Científicas
  "Topic :: Scientific/Engineering :: Bio-Informatics",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",

  # Entorno de Ejecución
  "Environment :: Console",  
  "Environment :: GPU :: NVIDIA CUDA",
  "Operating System :: OS Independent", # Preference Linux but also works on Windows. OSX not tested.
]
dependencies = [
    # Core data / config
    "pydantic>=2.12.5",
    "pydantic-settings>=2.0.0",
    "polars>=1.39.3",
    "pandas>=2.3.0",
    "numpy>=2.0.0",
    "networkx<=3.5",
    "scikit-learn",
    "joblib>=1.5.0",
    "tqdm",
    # Deep learning — CUDA 13.0 wheels routed via [tool.uv.sources]
    "torch==2.11.0",
    "torchvision==0.26.0",
    "torchaudio==2.11.0",
    "torch_geometric>=2.6.0",
    "pyg_lib",
    "torch_scatter",
    "torch_sparse",
    "optuna>=4.0.0",
    # Genomics / cheminformatics
    "rdkit>=2025.9.6",
    "pysam>=0.22.0",
    "pyfaidx>=0.9.0.4",
    "biopython>=1.85",
    # API service
    "fastapi>=0.135.2",
    "uvicorn>=0.30.0",
    # Misc
    "requests>=2.32.0",
    "matplotlib>=3.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.28.0",     # API TestClient transport
    "ruff>=0.0.280",
    "mypy>=1.3.0",
    "coverage>=7.0.0",
]

[project.urls]
Homepage = "https://github.com/Aderfi/Pharmagen_development"
Repository = "https://github.com/Aderfi/Pharmagen_development"
Documentation = "https://github.com/Aderfi/Pharmagen_development/blob/main/README.md"
"Bug Tracker" = "https://github.com/Aderfi/Pharmagen_development/issues"

# =============================================================================
# UV CONFIGURATION
# =============================================================================
# PyTorch CUDA 13.0 wheels live on the PyTorch index; the PyG companion
# wheels (pyg_lib/torch_scatter/torch_sparse) live on a flat find-links
# index keyed by the exact torch+CUDA build. Both indexes are `explicit`,
# so they are only consulted for the packages mapped in [tool.uv.sources].
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pyg"
url = "https://data.pyg.org/whl/torch-2.11.0+cu130.html"
format = "flat"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
torchaudio = { index = "pytorch-cu130" }
pyg_lib = { index = "pyg" }
torch_scatter = { index = "pyg" }
torch_sparse = { index = "pyg" }


# =============================================================================
# CONFIGURACIÓN DE SETUPTOOLS (Layout src)
# =============================================================================
[tool.setuptools]
# Soporte para archivos de datos
include-package-data = true
[tool.setuptools.packages.find]
where = ["src"]  # Source code lives under src/
include = ["*"]

# =============================================================================
# CONFIGURACIÓN DE HERRAMIENTAS DE CALIDAD DE CÓDIGO
# =============================================================================
[tool.ruff]
# Directorios a excluir
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".venv_pgen",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "BACKUPS",
    "cache",
]

# Configuración básica
line-length = 88
indent-width = 4
target-version = "py314"

[tool.ruff.lint]
# Reglas habilitadas
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
    "PL",    # pylint
    "RUF",   # ruff-specific rules
]

ignore = [
    "E203",    # Espacio antes de ':', incompatible con formatters
    "E501",    # Longitud de línea, gestionado por el formatter
    "F403",    # 'from module import *' - permitido en algunos casos
    "F401",    # Importación no utilizada - puede ser intencional
    "PLR0913", # Demasiados argumentos en función
    "PLR2004", # Magic value usado en comparación
    "PLC0415", # Importación fuera del top-level
    "FIX003", # TODOs
    "EM101",  # Raw string literals in exceptions
    "D212",   # Multi-line docstring summary start
]


# Permitir arreglos automáticos
fixable = ["ALL"]
unfixable = []

# Variables dummy permitidas
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/**/*.py" = ["PLR2004", "S101"]

[tool.ruff.lint.isort]
known-first-party = ["pharmagen"]
force-single-line = false
lines-after-imports = 2

[tool.ruff.format]
# Estilo de formateo (compatible con Black)
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true

# =============================================================================
# CONFIGURACIÓN DE PYTEST
# =============================================================================
[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

# =============================================================================
# CONFIGURACIÓN DE MYPY (Type Checking)
# =============================================================================
[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "biopython.*",
    "torch.*",
    "sklearn.*",
    "optuna.*",
]
ignore_missing_imports = true

# =============================================================================
# CONFIGURACIÓN DE COVERAGE
# =============================================================================
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
