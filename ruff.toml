# Configuration for Ruff 0.x+
# Target version corresponds to your pyproject.toml requirement
target-version = "py314"
line-length = 88
indent-width = 4

# Exclude directories (Standard pattern for Debian/Windows environments)
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".venv_pgen",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "BACKUPS",
    "cache",
    "train_data",  # one-off ETL scripts + data artifacts, not part of the package
]

[lint]
# Patterns enabled:
# PL (Pylint), E/W (pycodestyle), I (isort), F (Pyflakes), TID253 (banned imports)
# UP (pyupgrade) — modern py3.14 typing: list/dict/X | None instead of List/Dict/Optional
# FA (flake8-future-annotations), TC (flake8-type-checking)
select = ["PL", "E", "W", "I", "F", "TID253", "UP", "FA", "TC"]
ignore = [
    "E203",   # Conflicting with Black-style formatting
    "E501",   # Line length handled by formatter
    "F403",   # star imports
    "F401",   # unused imports
    "FIX003", # TODOs
    "EM101",  # Raw string literals in exceptions
    "D212",   # Multi-line docstring summary start
    "PLC0415",
    "PLR0913",
    "PLW2901",
    "PLR2004",
]

# Fix behavior
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.per-file-ignores]
# Merged from the former pyproject [tool.ruff] config (now the single source).
"__init__.py" = ["F401", "F403"]
# Pydantic models resolve type hints at runtime to build/validate; moving the
# imported types into a TYPE_CHECKING block (TC001/2/3) would break them.
"src/domain/**/*.py" = ["TC001", "TC002", "TC003"]
"src/kg/**/*.py" = ["TC001", "TC002", "TC003"]
# FastAPI resolves route/dependency annotations at runtime as well.
"src/api/**/*.py" = ["TC001", "TC002", "TC003"]
# Pydantic config models of the library build (Path resolved at runtime).
"src/data/library/config.py" = ["TC003"]
"tests/**/*.py" = ["PLR2004", "S101"]
# Standalone utility/visualisation scripts: kept formatted + linted, but not
# held to the package's function-complexity budget.
"scripts/**/*.py" = ["PLR0912", "PLR0915"]
"setup/**/*.py" = ["PLR0912", "PLR0915"]
# Demo notebooks: the setup cell has to clone the repository and put it on
# sys.path before it can import anything from it, so its imports cannot come
# first (E402).
"notebooks/*.ipynb" = ["E402"]
# colab_setup holds the project's 3.14 kernel in a module-level singleton, so
# that %%pgen cells share one kernel and its state; rebinding it is the point.
"notebooks/colab_setup.py" = ["PLW0603"]

[format]
# Standard Black-compatible formatting
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
