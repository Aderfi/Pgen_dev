# src/config/data/models.toml

# ==========================================
# MODELO 1: Phenotype_Effect_Outcome
# ==========================================
[TwoTowerGAT]
# Features && Targets Definition

cols = ["drugs_cid", "drugs", "genotype", "gene", "phenotype_category"]
features = ["drugs_cid", "genotype"]
targets = ["phenotype_category"]
#stratify_col = "phenotype_category"  # Column used for stratified splitting


# --- Graph Input Dimensions (HARD REQUIREMENTS) ---
# Must match DRUG_NODE_DIM / DRUG_EDGE_DIM / DRUG_GLOBAL_DIM in
# src/data/library/drugs.py.
drug_node_features = 61
drug_attrs_features = 18
drug_global_features = 1038   # per-molecule descriptor vector: 14 QSAR physchem + 1024 ECFP4
drug_admet_features = 41      # predicted ADMET/CYP profile (ADMET-AI); see src/data/library/admet.py

    # NODES --> element[13], degree[7], valence[7], charge scalar+1h[5], hybridization[7],
    #           total_Hs[5], chirality[4], aromatic+in_ring[2], ring_sizes[5],
    #           gasteiger[1], electronegativity[1], H_donor+acceptor[2], mass+radicals[2]
    # EDGES --> bond_type[5], conjugated[1], in_ring[1], ring_sizes[5], stereo[6]
    # GLOBAL --> MolWt, LogP, TPSA, HBD, HBA, RotBonds, FractionCSP3, RingCount,
    #            AromaticRings, AliphaticRings, Heteroatoms, SaturatedRings, QED,
    #            StereoCenters (14) + Morgan/ECFP4 fingerprint (1024)
    # ADMET  --> absorption[8], distribution[3], metabolism/CYP[8], excretion[3],
    #            toxicity[19] = 41 predicted endpoints (decoupled from GLOBAL)


# Haplo Tower (From all_in_one.py)
geno_node_features = 9   # [backbone, split/merge, ref, alt, score]
geno_attrs_features = 3      # [backbone_link, ref_path, alt_path] (If you applied the fix I suggested)



# --- OPTUNA SEARCH SPACE ---
# These define the range/choices for the Tuner
[TwoTowerGAT.optuna]
### --- Arquitectura (GNN & Towers) --- ###
patience = 10
epochs = 100
# "categorical" 
embedding_dim = ["categorical", 256, 512]
hidden_dim = ["categorical", 512, 768, 1024]

# "int" 
n_layers = ["int", 4, 6]

# Attention Heads (GATv2).
heads = ["categorical", 8, 12, 16]

# "float" 
dropout_rate = ["float", 0.35, 0.6]

### --- Optimization (training loop) --- ###

# "log"
learning_rate = ["log", 2e-4, 8e-4]
weight_decay = ["log", 1e-5, 1e-4]

# Batch size affects generalization and VRAM usage.
batch_size = ["categorical", 64, 128]

# --- Loss hyperparameters ---
# Critical when using FocalLoss or AsymmetricLoss (see losses.py).
# gamma: how strongly hard examples are penalized.
gamma = ["float", 2.0, 3.5]
# asl_clip: AsymmetricLoss easy-negative clipping factor.
asl_clip = ["float", 0.1, 0.25]

[TwoTowerGAT.params]
# Architecture
embedding_dim = 256
hidden_dim = 512
n_layers = 5
heads = 8
dropout_rate = 0.4859822310846825
# Optimization
learning_rate = 0.00040560545904101556
weight_decay = 4.089545393645109e-05
batch_size = 64
gamma = 2.912048826308894
asl_clip = 0.1575118661574606


# ==========================================