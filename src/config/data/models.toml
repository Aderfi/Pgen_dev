# ==========================================
# MODEL 1: Phenotype_Effect_Outcome
# ==========================================
[TwoTowerGAT]
# Features && Targets Definition

# alleles (zygosity / star diplotype) and variant_annotation_id (allele-specific
# HGVS link from the KG) feed the HGVS genotype graph.
# drugs_chembl holds drug entity keys (CHEMBL<n>, or ATC:<codes> for a drug
# class); is_class_row marks rows with a class entity (train-only).
cols = ["drugs_chembl", "drugs", "is_class_row", "genotype", "gene", "alleles", "variant_annotation_id", "pmid", "phenotype_category"]
features = ["drugs_chembl", "genotype"]
targets = ["phenotype_category"]
#stratify_col = "phenotype_category"  # Column used for stratified splitting


# --- Graph Input Dimensions (HARD REQUIREMENTS) ---
# Drug Tower — Modephere's molecule graph (modephere.featurize.molecule_data).
# Its widths come from Modephere's layout (modephere.types.layouts
# MOLECULE_GRAPH_V1: today 61 node / 18 edge / 1038 global) and the ADMET-AI
# profile from src/data/library/admet.py (DRUG_ADMET_DIM, 41); see GraphDims in
# src/data/cache.py. Set drug_node_features / drug_attrs_features /
# drug_global_features / drug_admet_features here only to override them.
    # NODES --> element[13], degree[7], valence[7], charge scalar+1h[5], hybridization[7],
    #           total_Hs[5], chirality[4], aromatic+in_ring[2], ring_sizes[5],
    #           gasteiger[1], electronegativity[1], H_donor+acceptor[2], mass+radicals[2]
    # EDGES --> bond_type[5], conjugated[1], in_ring[1], ring_sizes[5], stereo[6]
    # GLOBAL --> 14 QSAR physchem descriptors + Morgan/ECFP4 fingerprint (1024)
    # ADMET  --> absorption[8], distribution[3], metabolism/CYP[8], excretion[3],
    #            toxicity[19] = 41 predicted endpoints (decoupled from GLOBAL)


# Genotype Tower — HGVS variant graph (src/data/genotype): gene hub node(s) +
# one node per HGVS variant, cis-adjacency in genomic order.
geno_node_features = 45  # HGVS_NODE_DIM: node type[2] + edit kind[8] + level[3]
                         # + coding region[5] + sequence change[4]
                         # + SO consequence[13] + protein change[8] + dosage[2]
geno_attrs_features = 3  # GENO_EDGE_DIM: [membership, adjacency, log distance]
geno_function_features = 6   # star-allele PGx function vector (PATH_FUNCTION_DIM)
    # GENO FUNCTION --> PGx function one-hot[no,decreased,normal,increased]
    #                   + activity_score + pgx_known mask (6), averaged over the
    #                   star alleles the genotype names.



# --- OPTUNA SEARCH SPACE ---
# These define the range/choices for the Tuner
[TwoTowerGAT.optuna]
### --- Architecture (GNN & towers) --- ###
patience = 10
epochs = 100
# "categorical" 
embedding_dim = ["categorical", 256, 512]
hidden_dim = ["categorical", 512, 768, 1024]

# "int" 
n_layers = ["int", 4, 6]

# Attention Heads (GATv2).
heads = ["categorical", 8, 12, 16]

# "float" 
dropout_rate = ["float", 0.35, 0.6]

### --- Optimization (training loop) --- ###

# "log"
learning_rate = ["log", 2e-4, 8e-4]
weight_decay = ["log", 1e-5, 1e-4]

# Batch size affects generalization and VRAM usage.
batch_size = ["categorical", 64, 128]

[TwoTowerGAT.params]
# Architecture
embedding_dim = 256
hidden_dim = 512
n_layers = 5
heads = 8
dropout_rate = 0.4859822310846825
# Optimization
learning_rate = 0.00040560545904101556
weight_decay = 4.089545393645109e-05
batch_size = 64


# ==========================================