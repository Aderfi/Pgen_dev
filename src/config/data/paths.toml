# src/config/data/paths.toml

[base]
# Root folders
data = "data"
logs = "logs"
results = "results"
reports = "reports"
cache = "cache"
library = "data/library"
src = "src"

[data]
# Subcarpetas de data
raw = "data/raw"
processed = "data/processed"
dicts = "data/dicts"
ref_genome = "data/ref_genome"

[models]
# Deep Learning model artifact directories (generated, ignored via data/*)
root = "data/pgen_model"
models_saved = "data/pgen_model/models"
encoders = "data/pgen_model/encoders"
vocabs = "data/pgen_model/labels_vocabs"

[reports]
# Subcarpetas de reports
figures = "reports/figures"
optuna = "reports/optuna_reports"
training = "reports/train_reports"

[genome_references]
ref_genome_dir = "data/ref_genome"
ref_genome_fasta = "data/ref_genome/HSapiens_GChr38.fa"
# GRCh38 RefSeq annotation + sequence (NCBI GCF_000001405.26), used to build
# per-gene variation graphs and resolve c./p. HGVS.
ref_genome_gff = "data/ref_genome/HSapiens_GChr38.gff"
ref_genome_rna_fasta = "data/ref_genome/HSapiens_GChr38.rna.fna"
ref_genome_cds_fasta = "data/ref_genome/HSapiens_GChr38.cds.fna"