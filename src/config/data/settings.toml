# src/config/data/settings.toml
[metadata]
project_name = "Pharmagen"
version = "0.7"
author = "Adrim Hamed Outmani"

[project]
multi_label_cols = ["phenotype_category"]
seed = 711

#==== Per-axis overrides (multi-task head config) ===============
# Uncomment and add a [axes.<axis_name>] table per prediction target to
# override its inferred defaults. All fields are optional.
# [axes.direction_of_effect]
# kind = "ordinal"
# pos_weight = 1.5
# focal_gamma = 2.0
# class_weights = [1.0, 2.0, 1.0]
# embedding_dim = 64
# enabled = true

[modephere]
# Modephere drives the drug library and the HGVS catalog inputs. Relative paths
# resolve against the project root; PHARMAGEN_MODEPHERE__<FIELD> overrides.
library = "data/library"           # LibraryStore: compounds/<InChIKey>.safetensors + parquet
cache = "data/cache/modephere"     # PubChem raw cache (drugs ChEMBL cannot resolve)
chembl = "data/chembl"             # staged ChEMBL releases; the newest is used
pgx_export = "data/library/pgx"    # Modephere pgx export tables
logs = "logs/library"              # build failure / saturation reports
max_heavy_atoms = 300              # standardizer cap (exenatide 295, liraglutide 266)

[modephere.kg]
# Modephere's Neo4j, read by 'python -m src.data.library --refresh-pgx'.
# Password: PHARMAGEN_MODEPHERE__KG__PASSWORD (never in this file).
uri = "bolt://localhost:7688"
user = "neo4j"
database = "neo4j"
